Merge Build Test:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'test'
      when: on_success
  tags:
    - runner-k8s-uit
  script:
    - sh /scripts/s1.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME -d merge -t merge -l -n # cambiar `l` por `D` para debug

Merge Build Develop:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'develop'
      when: on_success
  tags:
    - runner-kt9-upat
  script:
    - sh /scripts/s1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -d merge -t merge -l -n # cambiar `l` por `D` para debug
