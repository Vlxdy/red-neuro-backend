###################################################################################################
#                                                                                                 #
#   Rama test                                                                                     #
#                                                                                                 #
###################################################################################################
Merge Build Test:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'test'
      when: on_success
  tags:
    - runner-k8s-uit
  script:
    - sh /scripts/s2.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME -d merge -t merge -n

Ejecutar test Test:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/library/node:20-alpine
  stage: sast
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'test'
      when: on_success
  tags:
    - runner-k8s-uit
  script:
    - sh /scripts/test.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME -test jest
  allow_failure: true
  artifacts:
    paths:
      - results_test
    expire_in: 1d

Audit npm Test:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/library/node:20-alpine
  stage: sast
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'test'
      when: on_success
  tags:
    - runner-k8s-uit
  script:
    - sh /scripts/test.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME -test audit
  allow_failure: true
  artifacts:
    paths:
      - results_test
    expire_in: 1d

Njsscan Test:
  image: hub.upat.agetic.gob.bo/dockerhub-proxy/opensecurity/njsscan:0.3.6
  stage: sast
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'test'
      when: on_success
  tags:
    - runner-k8s-uit
  script:
    - bash /scripts/njsscan.sh
  allow_failure: true
  artifacts:
    paths:
      - results_test
    expire_in: 1d

Trivy Test:
  image: hub.agcs.agetic.gob.bo/trivy/trivy_db:latest
  stage: sast
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'test'
      when: on_success
  tags:
    - runner-k8s-uit
  script:
    - sh /scripts/trivy.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME
  allow_failure: true
  artifacts:
    paths:
      - results_test
    expire_in: 1d

Exponer_archivos Test:
  image: hub.agcs.agetic.gob.bo/kaniko/alpine:3.20.1
  stage: export
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'test'
      when: on_success
  tags:
    - runner-k8s-uit
  needs:
    - job: Njsscan Test
      artifacts: true
    - job: Audit npm Test
      artifacts: true
    - job: Ejecutar test Test
      artifacts: true
    - job: Trivy Test
      artifacts: true
  dependencies:
    - Njsscan Test
    - Audit npm Test
    - Ejecutar test Test
    - Trivy Test
  script:
    - sh /scripts/export_files.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME
  allow_failure: true


