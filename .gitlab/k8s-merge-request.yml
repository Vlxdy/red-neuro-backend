Merge Build Test:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.2-s-debug
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  tags:
    - uit-k8s
  script:
    - sh /scripts/s1.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME -d merge -D # cambiar `l` por `D` para debug

Merge Build Develop:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.2-s-debug
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  tags:
    - kt7
  script:
    - sh /scripts/s1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -d merge -D # cambiar `l` por `D` para debug
