Generar imagen de la aplicación:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: on_success
      allow_failure: false
  tags:
    - runner-kt9-upat
  script:
    - sh /scripts/s1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -t development-base -l -s

Desplegar la aplicación en ArgoCD:
  image: hub.agcs.agetic.gob.bo/kaniko/alpine:3.20.1
  stage: deploy
  dependencies:
    - Generar imagen de la aplicación
  needs:
    - job: Generar imagen de la aplicación
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: on_success
      allow_failure: false
  tags:
    - runner-kt9-upat
  script:
    - sh /scripts/d1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -l

Ejecutar test:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: on_success
  tags:
    - runner-kt9-upat
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  script:
    - sh /scripts/s1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -d coverage -t coverage -l -s
    - cp -r /home/node/app/coverage ./coverage
    - failures=$(sed -n '2p' ./coverage/junit.xml | sed -n 's/.*failures="\([0-9]\+\)".*/\1/p')
    - if ["$failures" -gt 0]; then exit 1; fi
  artifacts:
    when: always
    paths:
      - ./coverage
    reports:
      junit:
        - ./coverage/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  when: manual

Audit npm:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/library/node:20-alpine
  stage: sast
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: manual
  tags:
    - runner-kt9-upat
  script:
    - npm ci
    - npm audit --json | npx npm-audit-helper
  when: manual

Njsscan:
  image: hub.upat.agetic.gob.bo/dockerhub-proxy/opensecurity/njsscan:0.3.6
  stage: sast
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: manual
  tags:
    - runner-kt9-upat
  variables:
    SCAN_NJSSCAN: scan_njsscan_$CI_COMMIT_SHORT_SHA.html
  script:
    - find . -name "*.ts" | xargs njsscan --missing-controls
  when: manual

Trivy:
  image: hub.upat.agetic.gob.bo/dockerhub-proxy/aquasec/trivy:0.46.0
  stage: sast
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: manual
  tags:
    - runner-kt9-upat
  before_script:
    - source /scripts/c1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -l
    - export IR_USER=$HUB_USERNAME
    - export IR_IOP_REPO=$HUB_PROJECT
    - export TRIVY_AUTH_URL=$HUB_URL
    - export TRIVY_PASSWORD=$HUB_PASSWORD
    - export TRIVY_USERNAME=robot\$$IR_USER
    - export IR_REPO_URL=$TRIVY_AUTH_URL/$IR_IOP_REPO/$CI_PROJECT_NAME
  script:
    - time trivy image --clear-cache
    - time trivy image --download-db-only
    - time trivy image $IR_REPO_URL:$CI_COMMIT_SHORT_SHA
  when: manual

Setup de la base de datos:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: setup
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
      when: manual
  tags:
    - runner-kt9-upat
  script:
    - sh /scripts/s1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -d setup -n -l -s -t setup
  when: manual