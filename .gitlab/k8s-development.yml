Generar imagen de la aplicación:
  image: hub.agcs.agetic.gob.bo/kaniko/kaniko-debug:1.35.0
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: on_success
      allow_failure: false
  tags:
    - kt7-dev
  script:
    - echo $CONFIGURE_NAMESPACES | base64 -d > ./configure-namespaces.sh
    - chmod +x ./configure-namespaces.sh
    - . ./configure-namespaces.sh
    - 'wget "$VAULT_DOMAIN/v1/$VAULT_ROOT_PATH/data/$CLUSTER_NAME/$PATH_FOLDER/$NAMESPACE/infraestructura/harbor" --header "X-Vault-Token: $VAULT_TOKEN" -O harbor.json'
    - export IR_CHART_NAME=$(grep -o '"IR_CHART_NAME":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export IR_DOMAIN=$(grep -o '"IR_DOMAIN":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export IR_IOP_REPO=$(grep -o '"IR_IOP_REPO":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export IR_PASS=$(grep -o '"IR_PASS":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export IR_USER=$(grep -o '"IR_USER":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - echo $CONFIGURE_IMAGE | base64 -d > ./configure-image-generation.sh
    - chmod +x ./configure-image-generation.sh
    - . ./configure-image-generation.sh
    - export S3_ENDPOINT=$(grep -o '"S3_ENDPOINT":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export AWS_ACCESS_KEY_ID=$(grep -o '"AWS_ACCESS_KEY_ID":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export AWS_SECRET_ACCESS_KEY=$(grep -o '"AWS_SECRET_ACCESS_KEY":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export S3_BUCKET=$(grep -o '"S3_BUCKET":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - rm harbor.json
    - /kaniko/executor --context . --target=$NAMESPACE --dockerfile ./dockerfile --build-arg CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA --build-arg CI_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME --build-arg CI_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" --destination $IR_REPO_URL:$NAMESPACE --destination $IR_REPO_URL:$CI_COMMIT_SHORT_SHA --cache --cache-repo=$IR_REPO_URL/kaniko-cache --cache-ttl=48h --cache-dir=/workspace --skip-unused-stages

Ejecutar tests:
  image: hub.agcs.agetic.gob.bo/kaniko/kaniko-debug:1.35.0
  stage: test
  dependencies:
    - Generar imagen de la aplicación
  needs:
    - job: Generar imagen de la aplicación
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH =~ /test.*/
  tags:
    - k8s-uit
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  script:
    - echo $CONFIGURE_NAMESPACES | base64 -d > ./configure-namespaces.sh
    - chmod +x ./configure-namespaces.sh
    - . ./configure-namespaces.sh
    - 'wget "$VAULT_DOMAIN/v1/$VAULT_ROOT_PATH/data/$CLUSTER_NAME/$PATH_FOLDER/$NAMESPACE/infraestructura/harbor" --header "X-Vault-Token: $VAULT_TOKEN" -O harbor.json'
    - export IR_CHART_NAME=$(grep -o '"IR_CHART_NAME":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export IR_DOMAIN=$(grep -o '"IR_DOMAIN":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export IR_IOP_REPO=$(grep -o '"IR_IOP_REPO":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export IR_PASS=$(grep -o '"IR_PASS":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export IR_USER=$(grep -o '"IR_USER":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - echo $CONFIGURE_IMAGE | base64 -d > ./configure-image-generation.sh
    - chmod +x ./configure-image-generation.sh
    - . ./configure-image-generation.sh
    - export S3_ENDPOINT=$(grep -o '"S3_ENDPOINT":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export AWS_ACCESS_KEY_ID=$(grep -o '"AWS_ACCESS_KEY_ID":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export AWS_SECRET_ACCESS_KEY=$(grep -o '"AWS_SECRET_ACCESS_KEY":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - export S3_BUCKET=$(grep -o '"S3_BUCKET":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' -e 's/"$//')
    - rm harbor.json
    - 'wget "$VAULT_DOMAIN/v1/$VAULT_ROOT_PATH/data/$CLUSTER_NAME/$PATH_FOLDER/$NAMESPACE/$CI_PROJECT_NAME/k8s" --header "X-Vault-Token: $VAULT_TOKEN" -O secrets.json'
    - /kaniko/executor --context . --target=coverage --dockerfile ./dockerfile.coverage --build-arg CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA --build-arg CI_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME --build-arg CI_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" --cache --cache-repo=$IR_REPO_URL/kaniko-cache --cache-ttl=48h --cache-dir=/workspace --no-push --skip-unused-stages
    - cp -r /home/node/app/coverage ./coverage
    - failures=$(sed -n '2p' ./coverage/junit.xml | sed -n 's/.*failures="\([0-9]\+\)".*/\1/p')
    - if ["$failures" -gt 0]; then exit 1; fi
  artifacts:
    when: always
    paths:
      - ./coverage
    reports:
      junit:
        - ./coverage/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  allow_failure: false

Desplegar la aplicación en ArgoCD:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/library/alpine:3.20.1
  stage: deploy
  dependencies:
    - Generar imagen de la aplicación
  needs:
    - job: Generar imagen de la aplicación
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: on_success
      allow_failure: false
  tags:
    - kt7-dev
  before_script:
    - apk update
    - apk add --no-cache curl jq yq bash
  script:
    - echo $CONFIGURE_NAMESPACES | base64 -d > ./configure-namespaces.sh
    - chmod +x ./configure-namespaces.sh
    - . ./configure-namespaces.sh
    - 'curl "$VAULT_DOMAIN/v1/$VAULT_ROOT_PATH/data/$CLUSTER_NAME/$PATH_FOLDER/$NAMESPACE/infraestructura/harbor" --header "X-Vault-Token: $VAULT_TOKEN" > harbor.json'
    - echo $(jq ".data.data" harbor.json) > harbor.json
    - export IR_CHART_NAME=$(grep -o '"IR_CHART_NAME":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export IR_CHART_REPO=$(grep -o '"IR_CHART_REPO":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export IR_CHART_VERSION=$(grep -o '"IR_CHART_VERSION":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export IR_DOMAIN=$(grep -o '"IR_DOMAIN":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export IR_IOP_REPO=$(grep -o '"IR_IOP_REPO":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export IR_PASS=$(grep -o '"IR_PASS":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export IR_USER=$(grep -o '"IR_USER":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - 'curl "$VAULT_DOMAIN/v1/$VAULT_ROOT_PATH/data/$CLUSTER_NAME/$PATH_FOLDER/$NAMESPACE/infraestructura/kubernetes" --header "X-Vault-Token: $VAULT_TOKEN" > kubernetes.json'
    - echo $(jq ".data.data" kubernetes.json) > kubernetes.json
    - export K8S_CA_DATA=$(grep -o '"K8S_CA_DATA":\ *"[^"]*"' kubernetes.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export K8S_SERVER_URL=$(grep -o '"K8S_SERVER_URL":\ *"[^"]*"' kubernetes.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export K8S_USER_TOKEN=$(grep -o '"K8S_USER_TOKEN":\ *"[^"]*"' kubernetes.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - 'curl "$VAULT_DOMAIN/v1/$VAULT_ROOT_PATH/data/$CLUSTER_NAME/$PATH_FOLDER/$NAMESPACE/infraestructura/argocd" --header "X-Vault-Token: $VAULT_TOKEN" > argocd.json'
    - echo $(jq ".data.data" argocd.json) > argocd.json
    - export ARGO_TOKEN=$(grep -o '"ARGO_TOKEN":\ *"[^"]*"' argocd.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export ARGO_SERVER=$(grep -o '"ARGO_SERVER":\ *"[^"]*"' argocd.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - echo $DEPLOY_CONTAINER | base64 -d > ./configure-container-deployment.sh
    - chmod +x ./configure-container-deployment.sh
    - . ./configure-container-deployment.sh
    - echo $ARGO_TEMPLATE | base64 -d > ./payload.json
    - echo $ARGO_CONFIG | base64 -d > ./payload.sh
    - chmod +x payload.sh
    - bash ./payload.sh
    - 'curl -X POST -H "Authorization: Bearer $ARGO_TOKEN" -H "Content-Type: application/json" -d @final_payload.json $ARGO_SERVER/api/v1/applications?upsert=true'

Audit npm:
  image: hub.agcs.agetic.gob.bo/dockerhub-proxy/library/node:20-alpine
  stage: sast
  rules:
    - if: $CI_COMMIT_BRANCH =~ /test.*/
      when: manual
  tags:
    - kubernetes-runner-testing
  script:
    - npm ci
    - npm audit --json | npx npm-audit-helper
  allow_failure: true

Njsscan:
  image: hub.upat.agetic.gob.bo/dockerhub-proxy/opensecurity/njsscan:0.3.6
  stage: sast
  rules:
    - if: $CI_COMMIT_BRANCH =~ /test.*/
      when: manual
  tags:
    - kubernetes-runner-testing
  variables:
    SCAN_NJSSCAN: scan_njsscan_$CI_COMMIT_SHORT_SHA.html
  script:
    - find . -name "*.ts" | xargs njsscan --missing-controls
  allow_failure: true

Trivy:
  image: hub.upat.agetic.gob.bo/dockerhub-proxy/aquasec/trivy:0.46.0
  stage: sast
  rules:
    - if: $CI_COMMIT_BRANCH =~ /test.*/
      when: manual
  tags:
    - kubernetes-runner-testing
  before_script:
    - echo $CONFIGURE_NAMESPACES | base64 -d > ./configure-namespaces.sh
    - chmod +x ./configure-namespaces.sh
    - . ./configure-namespaces.sh
    - 'wget "$VAULT_DOMAIN/v1/$VAULT_ROOT_PATH/data/$CLUSTER_NAME/$PATH_FOLDER/$NAMESPACE/infraestructura/harbor" --header "X-Vault-Token: $VAULT_TOKEN" -O harbor.json'
    - export IR_USER=$(grep -o '"IR_USER":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export IR_IOP_REPO=$(grep -o '"IR_IOP_REPO":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export TRIVY_AUTH_URL=$(grep -o '"IR_DOMAIN":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export TRIVY_PASSWORD=$(grep -o '"IR_PASS":\ *"[^"]*"' harbor.json | grep -o '"[^"]*"$' | sed -e 's/^"//' | sed -e 's/"$//')
    - export TRIVY_USERNAME=robot\$$IR_USER
    - export IR_REPO_URL=$TRIVY_AUTH_URL/$IR_IOP_REPO/$CI_PROJECT_NAME
  script:
    - time trivy image --clear-cache
    - time trivy image --download-db-only
    - time trivy image $IR_REPO_URL:$CI_COMMIT_SHORT_SHA
  allow_failure: true

