Generar imagen de la aplicación:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: on_success
      allow_failure: false
  tags:
    - uit-k8s
  script:
    - sh /scripts/s1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -T development-base -D

Desplegar la aplicación en ArgoCD:
  image: hub.agcs.agetic.gob.bo/kaniko/alpine:3.20.1
  stage: deploy
  dependencies:
    - Generar imagen de la aplicación
  needs:
    - job: Generar imagen de la aplicación
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: on_success
      allow_failure: false
  tags:
    - uit-k8s
  script:
    - sh /scripts/d1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -D

Setup de la base de datos:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: setup
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: manual
  tags:
    - uit-k8s
  script:
    - sh /scripts/s1.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -d setup -T setup -n -l -s
  when: manual