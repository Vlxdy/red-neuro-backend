Generar imagen de la aplicación:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: on_success
      allow_failure: false
  tags:
    - runner-kt9-upat
  script:
    - sh /scripts/s2.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -t development-base -u -s 

Desplegar la aplicación en ArgoCD:
  image: hub.agcs.agetic.gob.bo/kaniko/alpine:3.20.1
  stage: deploy
  dependencies:
    - Generar imagen de la aplicación
  needs:
    - job: Generar imagen de la aplicación
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: on_success
      allow_failure: false
  tags:
    - runner-kt9-upat
  script:
    - sh /scripts/d2.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME

Setup de la base de datos:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: setup
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: manual
  tags:
    - runner-kt9-upat
  script:
    - sh /scripts/s2.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME -d setup -t setup -n -s
  when: manual

Trivy:
  image: hub.upat.agetic.gob.bo/dockerhub-proxy/aquasec/trivy:0.46.0
  stage: sast
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: manual
      allow_failure: true
  tags:
    - runner-kt9-upat
  script:
    - sh /scripts/trivy.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME
  artifacts:
    paths:
      - results_test
    expire_in: 1d

Exponer_archivos:
  image: hub.agcs.agetic.gob.bo/kaniko/alpine:3.20.1
  stage: export
  rules:
    - if: $CI_COMMIT_BRANCH =~ /develop/
      when: manual
  tags:
    - runner-kt9-upat
  needs:
    - job: Trivy
      artifacts: true
  dependencies:
    - Trivy
  script:
    - sh /scripts/export_files.sh -p proyectos-base -e development-base -P $CI_PROJECT_NAME
