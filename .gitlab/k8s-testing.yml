Generar imagen de la aplicación:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == 'test'
      when: on_success
      allow_failure: false
  tags:
    - runner-k8s-uit
  script:
    - sh /scripts/s1.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME -T testing-base -l

Desplegar la aplicación en ArgoCD:
  image: hub.agcs.agetic.gob.bo/kaniko/alpine:3.20.1
  stage: deploy
  dependencies:
    - Generar imagen de la aplicación
  needs:
    - job: Generar imagen de la aplicación
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == 'test'
      when: on_success
      allow_failure: false
  tags:
    - runner-k8s-uit
  script:
    - sh /scripts/d1.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME -l

Setup de la base de datos:
  image: hub.agcs.agetic.gob.bo/kaniko/executor:v1.23.1-debug
  stage: setup
  rules:
    - if: $CI_COMMIT_BRANCH == 'test'
      when: manual
  tags:
    - runner-k8s-uit
  script:
    - sh /scripts/s1.sh -p proyectos-base -e testing-base -P $CI_PROJECT_NAME -d setup -T setup -n -l -s
  when: manual